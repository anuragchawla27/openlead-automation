<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 420" width="1060" height="420" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="OpenLead outreach and approval gate">
<title>OpenLead outreach and approval gate</title>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#475569"/></marker></defs>
<rect width="1060" height="420" fill="#ffffff"/>
<text x="30" y="34" font-size="17" font-weight="600" text-anchor="start" fill="#0f172a">Outreach, approval gate and alerts (three more workflows)</text><text x="30" y="54" font-size="12" font-weight="400" text-anchor="start" fill="#475569">Nothing is sent unless a person typed APPROVED. TEST_MODE stays on until the demo says otherwise.</text><rect x="30" y="90" width="170" height="84" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/><text x="115.0" y="121.0" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Master tab</text><text x="115.0" y="137.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">score 80+</text><text x="115.0" y="153.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">human_approval = PENDING</text><rect x="240" y="90" width="190" height="84" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="335.0" y="121.0" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">openlead-outreach</text><text x="335.0" y="137.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">Groq writes the draft; code</text><text x="335.0" y="153.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">checks length, quotes, numbers</text><rect x="470" y="90" width="170" height="84" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="555.0" y="121.0" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Human review</text><text x="555.0" y="137.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">reads draft, sets</text><text x="555.0" y="153.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">human_approval = APPROVED</text><rect x="680" y="90" width="170" height="84" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/><text x="765.0" y="121.0" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">openlead-dispatch</text><text x="765.0" y="137.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">Select Approved To Send</text><text x="765.0" y="153.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">(the gate)</text><rect x="890" y="90" width="150" height="84" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/><text x="965.0" y="121.0" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Gmail Send</text><text x="965.0" y="137.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">TEST_MODE: your own</text><text x="965.0" y="153.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">inbox only</text><line x1="200" y1="132" x2="240" y2="132" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/><line x1="430" y1="132" x2="470" y2="132" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/><line x1="640" y1="132" x2="680" y2="132" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/><line x1="850" y1="132" x2="890" y2="132" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/><rect x="470" y="230" width="380" height="150" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="660" y="252" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Gate checks (all must pass, max 5 sends per run)</text><text x="490" y="276" font-size="12" font-weight="400" text-anchor="start" fill="#0f172a">- approval word is exactly APPROVED</text><text x="490" y="294" font-size="12" font-weight="400" text-anchor="start" fill="#0f172a">- status DRAFTED, never SENT before</text><text x="490" y="312" font-size="12" font-weight="400" text-anchor="start" fill="#0f172a">- valid email, subject and draft present</text><text x="490" y="330" font-size="12" font-weight="400" text-anchor="start" fill="#0f172a">- draft contains the UNSUBSCRIBE footer</text><text x="490" y="348" font-size="12" font-weight="400" text-anchor="start" fill="#0f172a">- score 80 or more</text><text x="490" y="366" font-size="12" font-weight="400" text-anchor="start" fill="#0f172a">- email and domain not on Suppression_List</text><line x1="765" y1="174" x2="765" y2="230" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/><rect x="240" y="230" width="190" height="70" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="335.0" y="254.0" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Suppression_List</text><text x="335.0" y="270.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">email or domain: marked</text><text x="335.0" y="286.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">SUPPRESSED, never sent</text><line x1="470" y1="265" x2="430" y2="265" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/><rect x="30" y="330" width="370" height="70" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="215.0" y="354.0" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">openlead-error-handler</text><text x="215.0" y="370.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">Error Trigger -> Build Alert -> Telegram</text><text x="215.0" y="386.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">(workflow, failed node, execution id, error)</text><text x="30" y="230" font-size="13" font-weight="600" text-anchor="start" fill="#475569">Failure paths</text>
</svg>
