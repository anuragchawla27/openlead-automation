<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 410" width="1060" height="410" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="OpenLead discovery pipeline">
<title>OpenLead discovery pipeline</title>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#475569"/></marker></defs>
<rect width="1060" height="410" fill="#ffffff"/>
<text x="30" y="34" font-size="17" font-weight="600" text-anchor="start" fill="#0f172a">OpenLead discovery pipeline (workflow: openlead-automation)</text><text x="30" y="54" font-size="12" font-weight="400" text-anchor="start" fill="#475569">Every step after the model call is plain code. The model suggests; the code checks.</text><rect x="30" y="90" width="150" height="84" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="105.0" y="121.0" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Entry</text><text x="105.0" y="137.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">Intake Form or</text><text x="105.0" y="153.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">Daily Schedule 09:00 IST</text><rect x="200" y="90" width="150" height="84" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/><text x="275.0" y="113.0" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Parse + normalize</text><text x="275.0" y="129.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">Groq turns the prompt</text><text x="275.0" y="145.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">into a checked config</text><text x="275.0" y="161.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">(limit clamped to 100)</text><rect x="370" y="90" width="150" height="84" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/><text x="445.0" y="121.0" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Search</text><text x="445.0" y="137.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">SerpAPI, 1 call / 1.5 s</text><text x="445.0" y="153.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">retry x3, continue on fail</text><rect x="540" y="90" width="150" height="84" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/><text x="615.0" y="121.0" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Scrape</text><text x="615.0" y="137.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">Page + About page</text><text x="615.0" y="153.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">10 s timeout, 3 per s</text><rect x="710" y="90" width="150" height="84" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="785.0" y="121.0" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Extract</text><text x="785.0" y="137.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">Groq 120b, 1 call / 25 s</text><text x="785.0" y="153.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">fallback 20b on 429/400</text><rect x="880" y="90" width="150" height="84" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/><text x="955.0" y="121.0" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Verify (code)</text><text x="955.0" y="137.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">quote, name, email</text><text x="955.0" y="153.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">must be on the page</text><line x1="180" y1="132" x2="200" y2="132" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/><line x1="350" y1="132" x2="370" y2="132" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/><line x1="520" y1="132" x2="540" y2="132" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/><line x1="690" y1="132" x2="710" y2="132" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/><line x1="860" y1="132" x2="880" y2="132" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/><rect x="880" y="230" width="150" height="84" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/><text x="955.0" y="261.0" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Validate (code)</text><text x="955.0" y="277.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">email syntax, domain</text><text x="955.0" y="293.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">exclusion veto</text><rect x="710" y="230" width="150" height="84" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/><text x="785.0" y="261.0" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Score (code)</text><text x="785.0" y="277.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">industry, size, place,</text><text x="785.0" y="293.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">role, evidence = 0-100</text><rect x="540" y="230" width="150" height="84" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/><text x="615.0" y="261.0" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Dedup</text><text x="615.0" y="277.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">same domain never</text><text x="615.0" y="293.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">written twice</text><rect x="370" y="230" width="150" height="84" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/><text x="445.0" y="269.0" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Route</text><text x="445.0" y="285.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">80+ / 60-79 / under 60</text><line x1="955" y1="174" x2="955" y2="230" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/><line x1="880" y1="272" x2="860" y2="272" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/><line x1="710" y1="272" x2="690" y2="272" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/><line x1="540" y1="272" x2="520" y2="272" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/><line x1="370" y1="272" x2="300" y2="272" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/><rect x="30" y="214" width="265" height="116" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="162.5" y="236" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Google Sheet tiers</text><rect x="42" y="246" width="118" height="34" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/><text x="101.0" y="268.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">C Master 80+</text><rect x="166" y="246" width="118" height="34" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="225.0" y="268.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">B Review 60-79</text><rect x="42" y="288" width="118" height="34" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="101.0" y="310.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">B Quarantine &lt;60</text><rect x="166" y="288" width="118" height="34" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="225.0" y="310.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">A Raw research</text><text x="30" y="372" font-size="12" font-weight="400" text-anchor="start" fill="#475569">Talent track (same workflow): Reddit and portfolio-site searches -> page text -> Groq (low reasoning) -> code checks seeking-intent, skills and links on the page -> Talent_Leads.</text><text x="30" y="392" font-size="12" font-weight="400" text-anchor="start" fill="#475569">Any uncaught error in a production run -> openlead-error-handler -> Telegram alert.</text>
</svg>
